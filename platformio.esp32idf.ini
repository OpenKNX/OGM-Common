;
; ESP32 Custom-IDF extra_scripts
;
; This section replaces [ESP32]'s extra_scripts for IDF environments.
; PlatformIO's extends uses "last definition wins", so placing esp32idf
; at the END of an env's extends list shadows [ESP32]'s scripts.
;
; SCRIPTS IN THIS SECTION:
;   generate_versions.py   — lightweight versions.h generator (no ProjectAsLibBuilder)
;   create_esp32_image.py  — post-build: merge bootloader+partitions+app → factory.bin
;   idf_generate_crt_asm.py — pre-build:  IDF version tag + linker --wrap
;   idf_clean_artifacts.py  — pre-build:  clean stale IDF build artifacts
;
; SCRIPTS NOT HERE (Arduino-only, from [ESP32]):
;   prepare.py — uses PlatformIO's library resolver (ProjectAsLibBuilder)
;                which is incompatible with custom IDF builds.
;                generate_versions.py provides the same versions.h output
;                using a lightweight filesystem scan instead.
;
; HOW IT WORKS:
;   Normal (Arduino) envs inherit from [ESP32]:
;     → prepare.py + create_esp32_image.py run
;
;   IDF envs add  esp32idf  at the END of their extends list:
;     → generate_versions.py + create_esp32_image.py + IDF scripts run
;     → prepare.py does NOT run (shadowed)
;
; EXAMPLE (in project platformio.custom.ini):
;
;   [env:my_idf_env]
;   extends = custom_release_ESP32, ESP32_8MB, board_XYZ, sdkcfg_low_power, esp32idf
;   custom_idf_build = true
;   custom_sdkconfig = ${sdkcfg_low_power.custom_sdkconfig}
;
; GUARD FLAG (IDF environment detection):
;   Any [env:*] that should trigger the IDF-specific pre-scripts MUST have
;       custom_idf_build = true
;   set DIRECTLY in the [env:*] section (not in an extended section).
;   Environments without this flag are skipped by idf_generate_crt_asm.py
;   and idf_clean_artifacts.py.
;
[esp32idf]
extra_scripts =
  lib/OGM-Common/scripts/pio/generate_versions.py
  lib/OGM-Common/scripts/pio/create_esp32_image.py
  pre:lib/OGM-Common/scripts/idf/idf_generate_crt_asm.py
  pre:lib/OGM-Common/scripts/idf/idf_clean_artifacts.py
