; ============================================================
; Example: How to use ESP32/IDF support from OGM-Common
; ============================================================
;
; STEP 1 - Add to your project's platformio.ini:
;
;   [platformio]
;   extra_configs =
;     lib/OGM-Common/platformio.base.ini
;     lib/OGM-Common/platformio.esp32.ini
;     lib/OGM-Common/platformio.esp32idf.ini   ; <-- provides [esp32idf] section
;     platformio.custom.ini
;
; ============================================================
;
; STEP 2 - In your project's platformio.custom.ini:
;
; 2a) Define your sdkconfig presets.
;     "custom_sdkconfig" triggers pioarduino's call_compile_libs() which
;     builds IDF from source. Each sdkcfg_* section is a reusable preset.
;
;   [sdkcfg_ble_only]
;   custom_sdkconfig =
;     CONFIG_BT_ENABLED=y
;     CONFIG_BT_BLE_ENABLED=y
;     CONFIG_BT_CLASSIC_ENABLED=n
;     CONFIG_BT_NIMBLE_ENABLED=y
;     CONFIG_ESP_INSIGHTS_ENABLED=n
;     CONFIG_ESP_DIAGNOSTICS_ENABLED=n
;
;   [sdkcfg_wifi_on]
;   custom_sdkconfig =
;     CONFIG_BT_ENABLED=y
;     CONFIG_BT_BLE_ENABLED=y
;     CONFIG_BT_CLASSIC_ENABLED=n
;     CONFIG_BT_NIMBLE_ENABLED=y
;     CONFIG_ESP_WIFI_ENABLED=y
;     CONFIG_ESP_WIFI_STATION_ENABLED=y
;     CONFIG_ESP_COEX_ENABLED=y
;     CONFIG_ESP_INSIGHTS_ENABLED=n
;     CONFIG_ESP_DIAGNOSTICS_ENABLED=n
;
; ============================================================
;
; STEP 3 - Define your environments:
;
; Standard Arduino build -- no sdkcfg_* --> pre-built IDF libs are used.
; [ESP32]'s extra_scripts (prepare.py + create_esp32_image.py) run normally:
;
;   [env:release_MY_BOARD]
;   extends = custom_release_ESP32, ESP32_8MB, board_MY_BOARD
;   build_flags =
;     ${custom_release_ESP32.build_flags}
;     ${board_MY_BOARD.build_flags}
;
; Custom IDF build -- esp32idf at the END of extends ("last wins" strategy).
; This shadows [ESP32]'s extra_scripts with IDF-compatible scripts:
;   - prepare.py      → replaced by generate_versions.py (no library resolver)
;   - create_esp32_image.py → kept (factory.bin)
;   - idf_generate_crt_asm.py + idf_clean_artifacts.py → added (IDF only)
;
; custom_idf_build and custom_sdkconfig MUST be set DIRECTLY in [env:*]
; (not only via extends), because pioarduino's config.has_option() checks
; only the direct section.
;
;   [env:release_MY_BOARD_LOW_POWER]
;   extends = ESP32_8MB, board_MY_BOARD, custom_release_ESP32, sdkcfg_ble_only, esp32idf
;   custom_idf_build = true
;   custom_sdkconfig = ${sdkcfg_ble_only.custom_sdkconfig}
;   build_flags =
;     ${custom_release_ESP32.build_flags}
;     ${board_MY_BOARD.build_flags}
;
; ============================================================
